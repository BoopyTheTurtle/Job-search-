# Weekly crawl (ADR-0002, SPEC §10).
#
# Code is checked out from `main`; state lives on the orphan `data` branch, which this
# workflow clones into ./data (gitignored on main), updates, and pushes back as
# github-actions[bot]. The `data` branch holds jobbot.sqlite, digests/<search>/YYYY-MM-DD.md
# (one per search in config/searches/, ADR-0004) and runs/YYYY-MM-DD.json. It is created automatically on the first run.
#
# Secrets: RESEND_API_KEY, DIGEST_FROM, DIGEST_TO (email is skipped if any is missing).
# Optional source keys (a source is skipped without its own): ADZUNA_APP_ID, ADZUNA_APP_KEY,
# REED_API_KEY, FRANCE_TRAVAIL_CLIENT_ID, FRANCE_TRAVAIL_CLIENT_SECRET.
name: weekly-crawl

on:
  schedule:
    - cron: "17 6 * * 3"   # Wednesdays 06:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: Do not email and do not push to the data branch (digest only as artifact)
        type: boolean
        default: false
      sources:
        description: Comma-separated source names (empty = all enabled)
        required: false
        default: ""
      searches:
        description: Comma-separated search names from config/searches/ (empty = all)
        required: false
        default: ""
      since_days:
        description: Override the lookback window in days (empty = since last run)
        required: false
        default: ""
      limit:
        description: Max postings per source (0 = unlimited)
        required: false
        default: "0"

permissions:
  contents: write
  issues: write   # crawl-failure issue on a failed scheduled run

concurrency:
  group: weekly-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install
        run: uv sync

      - name: Check out data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch data "$url" data
            echo "data branch: existing ($(git -C data rev-parse --short HEAD))"
          else
            mkdir data
            git -C data init --quiet --initial-branch=data
            git -C data remote add origin "$url"
            printf '*.sqlite-wal\n*.sqlite-shm\n' > data/.gitignore
            echo "data branch: will be created on first push"
          fi

      - name: Run
        id: run
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          FRANCE_TRAVAIL_CLIENT_ID: ${{ secrets.FRANCE_TRAVAIL_CLIENT_ID }}
          FRANCE_TRAVAIL_CLIENT_SECRET: ${{ secrets.FRANCE_TRAVAIL_CLIENT_SECRET }}
          DRY_RUN: ${{ inputs.dry_run }}
          SOURCES: ${{ inputs.sources }}
          SEARCHES: ${{ inputs.searches }}
          SINCE_DAYS: ${{ inputs.since_days }}
          LIMIT: ${{ inputs.limit }}
        run: |
          set -uo pipefail
          args=(--db data/jobbot.sqlite --out-dir data)
          if [ "${DRY_RUN:-false}" = "true" ]; then args+=(--no-send); fi
          if [ -n "${SOURCES:-}" ]; then
            IFS=',' read -ra arr <<< "$SOURCES"
            for s in "${arr[@]}"; do args+=(--source "$(echo "$s" | xargs)"); done
          fi
          if [ -n "${SEARCHES:-}" ]; then
            IFS=',' read -ra arr <<< "$SEARCHES"
            for s in "${arr[@]}"; do args+=(--search "$(echo "$s" | xargs)"); done
          fi
          if [ -n "${SINCE_DAYS:-}" ]; then args+=(--since-days "$SINCE_DAYS"); fi
          if [ -n "${LIMIT:-}" ] && [ "$LIMIT" != "0" ]; then args+=(--limit "$LIMIT"); fi
          uv run jobbot run "${args[@]}"

      - name: Summary
        if: always()
        run: |
          shown=0
          for dir in data/digests/*/; do
            latest=$(ls -1 "$dir"*.md 2>/dev/null | sort | tail -n 1 || true)
            [ -n "$latest" ] || continue
            shown=1
            { echo "## Digest ($latest)"; echo; cat "$latest"; echo; } >> "$GITHUB_STEP_SUMMARY"
            echo "::group::Digest ($latest)"; cat "$latest"; echo "::endgroup::"
          done
          if [ "$shown" = 1 ]; then
            run_json=$(ls -1 data/runs/*.json 2>/dev/null | sort | tail -n 1 || true)
            if [ -n "$run_json" ]; then
              echo "::group::Run summary ($run_json)"; cat "$run_json"; echo "::endgroup::"
            fi
          else
            echo "No digest produced." >> "$GITHUB_STEP_SUMMARY"
            echo "No digest produced."
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: digest-${{ github.run_id }}
          path: |
            data/digests/
            data/runs/
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit and push data branch
        if: ${{ inputs.dry_run != true }}
        run: |
          set -euo pipefail
          cd data
          rm -f jobbot.sqlite-wal jobbot.sqlite-shm
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          stamp=$(date -u +%Y-%m-%d)
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "crawl ${stamp} (run ${GITHUB_RUN_ID})"
          git push --quiet origin HEAD:data

      - name: Open or update the crawl-failure issue
        if: steps.run.outcome == 'failure' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          latest=$(ls -1 data/runs/*.json 2>/dev/null | sort | tail -n 1 || true)
          summary="(no run summary written)"
          if [ -n "$latest" ]; then summary=$(cat "$latest"); fi
          body=$(printf '%s\n\n%s\n\n```json\n%s\n```\n\n%s' \
            "The weekly crawl on $(date -u +%Y-%m-%d) exited non-zero (more than half the sources failed, or the email failed)." \
            "Run: ${run_url}" \
            "$summary" \
            "This issue is updated by the workflow on each failure and should be closed by hand once the cause is fixed.")
          gh label create crawl-failure --color B60205 --description "Automated: a scheduled crawl failed" --force >/dev/null 2>&1 || true
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label crawl-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
            echo "updated issue #$existing"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "weekly-crawl failed on $(date -u +%Y-%m-%d)" \
              --label crawl-failure --body "$body"
          fi

      - name: Fail if the run failed
        if: steps.run.outcome == 'failure'
        run: |
          echo "jobbot run exited non-zero (more than half the sources failed, or email failed)."
          exit 1
