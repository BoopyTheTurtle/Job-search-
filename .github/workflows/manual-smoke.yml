# Manual smoke test for connectors. Runs `jobbot crawl --dry-run` against live APIs for
# one source (or every registered source, enabled or not) and uploads the JSON lines so
# the field mapping can be checked against real payloads before a source is enabled in
# config/sources.yaml. Never scheduled; dispatch it by hand.
name: manual-smoke

on:
  workflow_dispatch:
    inputs:
      source:
        description: Source name (empty = all registered sources, even if disabled)
        required: false
        default: ""
      limit:
        description: Max postings per source
        required: false
        default: "5"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync
      - name: Crawl (dry run)
        env:
          SOURCE: ${{ inputs.source }}
          LIMIT: ${{ inputs.limit }}
        run: |
          mkdir -p out
          args=(--dry-run --limit "${LIMIT:-5}")
          if [ -n "$SOURCE" ]; then
            args+=(--source "$SOURCE")
          else
            args+=(--all)
          fi
          uv run jobbot crawl "${args[@]}" > out/crawl.jsonl
          echo "lines: $(wc -l < out/crawl.jsonl)"
          echo "first 3 lines (truncated to 300 chars):"
          head -n 3 out/crawl.jsonl | cut -c1-300
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-${{ github.run_id }}
          path: out/
          retention-days: 14
