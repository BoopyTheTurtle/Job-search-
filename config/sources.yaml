# One entry per connector. `name` must match the module's registered name.
# `terms` is mandatory: the URL of the API terms or robots.txt we rely on (ADR-0001).
# Keys in `env` are read from the environment; missing keys disable the source at runtime.
# See docs/inventory/apis-and-feeds.md for endpoint details and rate limits.
#
# All Tier A connectors were verified against live payloads by the manual-smoke workflow
# on 2026-10-03 (field-mapping table in the job log) and are enabled. New connectors start
# `enabled: false` until their own smoke run passes.
sources:
  remotive:
    enabled: true
    tier: A
    terms: https://github.com/remotive-com/remote-jobs-api
    rate_limit_rps: 0.1   # Remotive: a few calls per day; we make one per run
    params: {}
  arbeitnow:
    enabled: true
    tier: A
    terms: https://www.arbeitnow.com/api
    rate_limit_rps: 1.0   # 429s on bursts: 1 s between pages, 10 pages max (see connector)
    params:
      page_delay: 1.0
      max_pages: 10
  remoteok:
    enabled: true
    tier: A
    terms: https://remoteok.com/api   # legal notice is element 0 of the response
    rate_limit_rps: 0.5   # unpublished; one request per run (~100 most recent jobs)
    params: {}
  himalayas:
    enabled: true
    tier: A
    terms: https://himalayas.app/api
    rate_limit_rps: 1.0   # unpublished; limit=20 per page, max 20 pages per run
    params:
      page_size: 20
  jobicy:
    enabled: true
    tier: A
    terms: https://github.com/Jobicy/remote-jobs-api
    rate_limit_rps: 0.1   # Jobicy: poll at most once per hour; one request per run
    params:
      geo: europe
  weworkremotely:
    enabled: true
    tier: A
    terms: https://weworkremotely.com/remote-job-rss-feed
    rate_limit_rps: 1.0   # none stated; one request per category feed
    params:
      feeds:
        - https://weworkremotely.com/categories/remote-programming-jobs.rss
        - https://weworkremotely.com/categories/remote-devops-sysadmin-jobs.rss
        - https://weworkremotely.com/categories/remote-full-stack-programming-jobs.rss
        - https://weworkremotely.com/categories/remote-back-end-programming-jobs.rss
        - https://weworkremotely.com/categories/remote-front-end-programming-jobs.rss
  workingnomads:
    enabled: true
    tier: A
    terms: https://www.workingnomads.com/api/exposed_jobs/   # no separate docs page found
    rate_limit_rps: 0.5   # unpublished; one request per run
    params: {}
  adzuna:
    enabled: true           # manual-smoke passed 2026-10-03 (AT, 5 live postings)
    tier: B
    terms: https://developer.adzuna.com/docs/terms_of_service   # "Jobs by Adzuna" credit required
    rate_limit_rps: 0.4     # terms: 25/min, 250/day, 1000/week; 13 countries x 2 pages = 26 calls
    env: [ADZUNA_APP_ID, ADZUNA_APP_KEY]
    params:
      countries: [at, be, de, es, fr, it, nl, pl, gb, us, ca, au, nz]
      what: remote
      category: it-jobs
      results_per_page: 50
      max_pages: 2
      page_delay: 1.0
  jobtech:
    enabled: true           # live dry-run crawl passed 2026-10-03; fixture is a trimmed real response
    tier: B
    terms: https://jobsearch.api.jobtechdev.se/   # API spec: "Ads are licensed under CC0"; header api-key: developer
    rate_limit_rps: 1.0     # none published; one or two requests per run (~30 remote IT ads a week)
    params:
      occupation_field: apaJ_2ja_LuF   # Data/IT
      page_size: 100
      max_pages: 5
  reed:
    enabled: false          # flip after REED_API_KEY is set and manual-smoke passes
    tier: B
    terms: https://www.reed.co.uk/developers/jobseeker   # credit Reed; no bulk redistribution
    rate_limit_rps: 1.0     # none published; 3 queries x up to 2 pages = 6 calls
    env: [REED_API_KEY]
    params:
      keywords: [remote developer, remote engineer, remote data]
      page_size: 100
      max_pages: 2
  francetravail:
    enabled: false          # flip after FRANCE_TRAVAIL_* secrets are set and manual-smoke passes
    tier: B
    terms: https://francetravail.io/data/api/offres-emploi   # francetravail.io CGU; attribution, no reselling
    rate_limit_rps: 3.0     # documented 3 req/s; 1 token call + up to 3 pages
    env: [FRANCE_TRAVAIL_CLIENT_ID, FRANCE_TRAVAIL_CLIENT_SECRET]
    params:
      keywords: télétravail
      domain: M18           # Informatique / Télécommunication
      page_size: 150
      max_pages: 3
      page_delay: 0.4
