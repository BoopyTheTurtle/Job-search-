# Role-family taxonomy. Patterns are case-insensitive regular expressions matched as whole
# tokens (not inside other words). Title matches weigh 3x description matches (SPEC §8.4).
families:
  software_dev:
    title:
      - "software (?:developer|engineer|development)"
      - "(?:web|frontend|front[- ]end|backend|back[- ]end|full[- ]?stack|mobile|ios|android|game|embedded|firmware|application|app|platform|cloud|api|systems?) (?:developer|engineer|programmer)"
      - "developer"
      - "programmer"
      - "programmētāj\\w*"
      - "développeur\\w*"
      - "desarrollador\\w*"
      - "entwickler\\w*"
      - "full[- ]?stack"
      - "frontend|front[- ]end"
      - "backend|back[- ]end"
      - "python|java|javascript|typescript|node(?:\\.js)?|react|angular|vue|svelte|php|laravel|symfony|ruby|rails|go(?:lang)?|rust|c#|\\.net|c\\+\\+|scala|kotlin|swift|flutter|django|fastapi|spring|wordpress|shopify|elixir|haskell|clojure"
      - "web"
      - "software engineering"
    description:
      # Each line is one independent signal; a title without any IT term needs three of them.
      - "python|javascript|typescript|java|kotlin|swift|golang|rust|c\\+\\+|c#|php|ruby|scala|elixir"
      - "react|angular|vue|svelte|next\\.js|node\\.js|django|fastapi|flask|spring boot|laravel|rails|symfony|\\.net|express"
      - "git|github|gitlab|pull requests?|code reviews?|unit tests?|integration tests?|tdd|pair programming"
      - "rest(?:ful)? apis?|graphql|grpc|microservices|websockets?|openapi|swagger"
      - "postgres(?:ql)?|mysql|sqlite|mongodb|redis|elasticsearch|\\bsql\\b"
      - "software (?:developer|engineer|development|engineering)|web (?:developer|development|application)|frontend|backend|full[- ]?stack"
  devops_cloud:
    title:
      - "devops|dev ops"
      - "sre|site reliability"
      - "platform engineer"
      - "cloud (?:engineer|architect|administrator|ops|operations)"
      - "infrastructure (?:engineer|architect)"
      - "kubernetes|k8s|docker|terraform|ansible|aws|azure|gcp"
      - "release engineer"
      - "observability"
      - "linux (?:engineer|administrator)"
      - "sysops|cloudops|finops"
    description:
      - "kubernetes|k8s|docker|terraform|ansible|helm|argo ?cd|prometheus|grafana|datadog"
      - "aws|amazon web services|azure|google cloud|gcp"
      - "ci/cd|continuous integration|continuous delivery|github actions|gitlab ci|jenkins"
      - "infrastructure as code|iac|sre|site reliability"
  data_ml_ai:
    title:
      - "data (?:engineer|scientist|analyst|architect|platform)"
      - "machine learning|ml (?:engineer|ops)|mlops"
      - "ai (?:engineer|developer|researcher|specialist)|artificial intelligence"
      - "deep learning|nlp|computer vision|llm|generative ai|prompt engineer"
      - "analytics engineer|bi (?:developer|engineer|analyst)|business intelligence"
      - "etl|data warehouse|dbt|spark|snowflake|databricks"
    description:
      - "pandas|numpy|scikit-learn|pytorch|tensorflow|hugging ?face|langchain"
      - "spark|airflow|dbt|snowflake|databricks|bigquery|redshift"
      - "machine learning|data pipelines?|data modeling|feature engineering|llms?"
      - "\\bsql\\b|data warehouse|etl|elt|statistics|a/b test|dashboards?|tableau|power bi|looker"
  it_ops_qa_product:
    title:
      - "it support|helpdesk|help desk|service desk|desktop support|technical support|support engineer"
      - "system(?:s)? administrator|sysadmin|network (?:engineer|administrator)|it (?:technician|specialist|administrator|manager|engineer|operations)"
      - "qa|quality assurance|test (?:engineer|automation|analyst)|sdet|tester|qa engineer"
      - "product (?:manager|owner)|technical product"
      - "(?:it|technical|software|digital) project manager|scrum master|delivery manager|agile coach"
      - "technical writer|solutions? (?:architect|engineer)|sales engineer"
      - "security (?:analyst|engineer)|cyber ?security|information security|soc analyst|penetration tester|pentester"
      - "database administrator|dba"
    description:
      - "ticketing|servicenow|jira service|active directory|office 365|m365|intune|itil"
      - "test cases|selenium|cypress|playwright|test automation|regression testing"
      - "product roadmap|backlog|stakeholders|user stories|scrum|sprints?"
      - "incident(?:s| management)|monitoring|windows server|linux|networking|vpn|firewall|sla"
  # The four families below serve the impact-finance search. Keep a title phrase in one
  # family only: a title that hits two families equally is ambiguous and becomes `other`.
  # French titles use "charg\\S*" so chargé, chargée and chargé(e) all match.
  intl_development:
    title:
      - "international development|development (?:cooperation|programmes?|programs?|specialist|officer|consultant|economist|practitioner|expert)"
      - "programme (?:officer|manager|coordinator|specialist|associate|analyst|assistant|director|lead)|program officer"
      - "humanitarian|livelihoods?|food security"
      - "monitoring,? (?:and|&) evaluation|m&e|meal (?:officer|specialist|manager|coordinator|advisor|adviser)|mel (?:officer|specialist|manager)"
      - "grants? (?:manager|officer|management|coordinator|specialist|administrator|lead)|donor relations|fundraising|fundraiser"
      - "développement international|coopération internationale|solidarité internationale|aide (?:humanitaire|au développement)"
      - "charg\\S* de programmes?|suivi[- ]évaluation|collecte de fonds|charg\\S* de partenariats?"
    description:
      - "international development|development cooperation|development partners?|official development assistance|donors?"
      - "ngos?|non[- ]governmental|united nations|un agenc(?:y|ies)|world bank|undp|unicef|usaid|fcdo|giz|enabel|european commission"
      - "monitoring (?:and|&) evaluation|logframe|logical framework|theory of change|beneficiar(?:y|ies)|capacity building"
      - "humanitarian|fragile (?:states|contexts)|global south|low- and middle-income|lmics?|sub-saharan"
      - "solidarité internationale|coopération internationale|bailleurs de fonds|bénéficiaires|renforcement des capacités|aide au développement"
  finance_investment:
    title:
      - "project finance|infrastructure finance|structured finance|development finance|climate finance|blended finance"
      - "investment (?:officer|analyst|manager|specialist|banker)|financial (?:analyst|modell?er|modell?ing)|credit (?:analyst|officer)"
      - "impact invest\\w*|green finance|sustainable finance|responsible investment|esg|sustainability (?:analyst|manager|specialist|officer|reporting|lead)|green bonds?"
      - "finance (?:transformation|projects?|project manager|business partner)|financial projects?"
      - "financement (?:de projets?|structuré|climat)|charg\\S* d['’]investissements?|analyste (?:financi\\w*|crédit|investissement)"
      - "finance (?:durable|verte|climat|à impact|responsable)|investissement (?:responsable|à impact|durable)|isr"
    description:
      - "project finance|financial (?:model|modell?ing)|irr|npv|debt (?:financing|structuring)|term sheets?|due diligence"
      - "development finance institutions?|dfis?|ifc|eib|ebrd|fmo|proparco|multilateral development banks?|mdbs?"
      - "esg|sustainable finance|climate finance|green bonds?|sfdr|eu taxonomy|tcfd|impact (?:investing|measurement)|blended finance"
      - "investment committee|credit risk|loans?|guarantees|mezzanine|senior debt"
      - "financement de projets|modèle financier|comité d['’]investissement|finance durable|investissement responsable"
  private_equity:
    title:
      - "private equity|venture capital|growth equity|buy[- ]?outs?|private markets?|private capital|private debt|secondaries|co[- ]?investments?"
      - "investment (?:associate|director|principal|partner)|infrastructure (?:fund|investment|equity)"
      - "portfolio (?:monitoring|valuation|operations)|value creation"
      - "fund (?:operations|administration|administrator|accountant|controller|finance|services|reporting)|investor relations|capital raising"
      - "capital[- ](?:investissement|risque|développement)|lbo|charg\\S* d['’]affaires (?:capital|investissement|private equity|lbo)"
      - "relations? investisseurs|gestion de fonds|middle[- ]office (?:fonds|private equity)"
    description:
      - "private equity|venture capital|buy[- ]?outs?|lbo|growth equity|private markets|limited partners?|general partners?"
      - "portfolio compan(?:y|ies)|deal (?:flow|sourcing|execution)|value creation|carried interest|assets under management|aum"
      - "fund (?:administration|accounting|reporting|operations)|nav|capital calls?|aifm|aifmd|depositary"
      - "capital[- ]investissement|sociétés du portefeuille|levée de fonds|participations"
  # Administration and coordination roles only: a bare "project manager" or "chef de
  # projet" is mostly IT, marketing or construction work and would flood the digest.
  project_admin:
    title:
      - "project (?:officer|coordinator|co-ordinator|administrator|assistant|support|associate|controller|analyst)|projects officer"
      - "pmo|project management office|programme support|project support officer"
      - "contracts? (?:administrator|officer)"
      - "charg\\S* de (?:projets?|mission)|coordinat\\S* de projets?|gestionnaire de projets?|assistant\\S* (?:de )?(?:chef de )?projets?"
      - "contrôleu\\S* de projets?"
    description:
      - "project (?:cycle|management|plan|budget|reporting|documentation)|work ?plans?|gantt|milestones|deliverables"
      - "budget (?:monitoring|tracking)|financial reporting|procurement|contracts? management"
      - "prince2|pmp|ipma|pmi|capm|pm²"
      - "gestion de projets?|suivi budgétaire|livrables|cahier des charges|marchés publics"
exclude:
  # Titles no search wants. Exclusions that only one search needs live in that search's
  # `exclude_title_patterns` (config/searches/*.yaml).
  title:
    - "account executive|account manager|sales (?:manager|representative|development|director)|sales$"
    - "recruiter|talent acquisition|sourcer|headhunter"
    - "marketing (?:manager|specialist|director)|seo specialist|content (?:writer|marketer)|copywriter"
    - "customer success manager|customer support representative|customer service"
    - "(?:office|administrative|executive|virtual|personal) assistant|office manager|receptionist"
    - "content reviewer|content moderator|data entry|transcri(?:ber|ption)|annotator|rater"
    - "accounts (?:receivable|payable)|clerk|auditor|tax "
    - "(?:graphic|visual|ui/ux|ux/ui|ux|ui|product|brand|motion) designer|illustrator|video editor"
    - "nurse|physician|therapist|pharmacist|dentist"
    - "mechanical engineer|civil engineer|electrical engineer|structural engineer|hvac|chemical engineer"
    - "truck|driver|warehouse|forklift|cleaner|janitor|cook|chef(?! de)|barista"
    - "teacher|tutor|attorney|lawyer|paralegal|bookkeeper|payroll"
    - "insurance agent|financial advisor|loan officer"
