# Copy to config/profile.yaml (gitignored) and edit. This file drives filtering and scoring.
eligible_regions: [WORLDWIDE, EU, EEA, EUROPE]
home_country: null            # ISO-3166 alpha-2, e.g. DE. Country-restricted postings for it will match.
languages: [en]
role_families: [software_dev, devops_cloud, data_ml_ai, it_ops_qa_product]
seniority: [intern, junior, mid]           # senior/lead postings are kept but collapsed in the digest
employment_types: [full_time, part_time, contract, freelance, internship]
keyword_boosts: [python, typescript, react, postgres, aws]
exclude_companies: []
exclude_title_patterns: ["\\bsales\\b", "recruiter", "account executive"]
digest:
  min_score: 50
  max_items: 150
  to: ["you@example.com"]
